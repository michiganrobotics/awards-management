# Copy to secret.yaml and fill in. secret.yaml is gitignored — never commit it.
# These are the same Google credentials used on Netlify.
apiVersion: v1
kind: Secret
metadata:
  name: awards-google
  namespace: coe-robotics-containers
type: Opaque
stringData:
  GOOGLE_SERVICE_ACCOUNT_EMAIL: "your-service-account@your-project.iam.gserviceaccount.com"
  GOOGLE_SHEET_ID: "spreadsheet-id"
  GOOGLE_DRIVE_FOLDER_ID: "drive-folder-id"
  # Keep the literal \n sequences from the JSON key, exactly as on Netlify.
  GOOGLE_PRIVATE_KEY: "-----BEGIN PRIVATE KEY-----\nMIIE...\n-----END PRIVATE KEY-----\n"
  # Claude connector (MCP). Signs the connector's OAuth tokens; generate with
  # `openssl rand -base64 48`. Changing it signs everyone's Claude out.
  # Without it, /mcp and /oauth/* return 503 and the rest of the app is unaffected.
  MCP_TOKEN_SECRET: "generate-with-openssl-rand-base64-48"
  # Public URL, used in the connector's OAuth metadata and consent-form check.
  APP_BASE_URL: "https://awards.robotics.umich.edu"
