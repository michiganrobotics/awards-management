# Reconciled to match the live deployment in `coe-robotics-containers`.
# Built by buildconfig.yaml into the `awards-app:latest` ImageStream tag; the
# image.openshift.io/triggers annotation rolls the Deployment on each new image.
#
# ClusterIP only — NOT exposed via a Route. The auth-proxy reaches it at
# awards-app.coe-robotics-containers.svc.cluster.local:3000 and is the sole
# entry point. Do NOT create a public Route here, or it bypasses auth.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: awards-app
  namespace: coe-robotics-containers
  labels: { app: awards-app }
  annotations:
    image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"awards-app:latest","namespace":"coe-robotics-containers"},"fieldPath":"spec.template.spec.containers[?(@.name==\"awards-app\")].image"}]'
spec:
  replicas: 1          # bump to 2 for node-failure resilience (app is stateless)
  selector:
    matchLabels: { deployment: awards-app }
  template:
    metadata:
      labels: { deployment: awards-app }
    spec:
      containers:
        - name: awards-app
          image: image-registry.openshift-image-registry.svc:5000/coe-robotics-containers/awards-app:latest
          ports:
            - containerPort: 3000
          env:
            # Trust the auth-proxy's X-Remote-* headers (it has already
            # authenticated + group-gated). Safe only because this Service is
            # ClusterIP-only and the proxy overwrites client-sent X-Remote-*.
            - name: TRUST_PROXY_AUTH
              value: "true"
          # Google service-account creds (see secret.example.yaml).
          envFrom:
            - secretRef: { name: awards-google }
          # Right-sized for the Medium tier; 640Mi limit leaves burst room for
          # SSR + the in-memory ZIP "download all". No probes (matches live).
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits:   { cpu: "1", memory: 640Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: awards-app
  namespace: coe-robotics-containers
  labels: { app: awards-app }
spec:
  selector: { deployment: awards-app }
  ports:
    - name: 3000-tcp
      port: 3000
      targetPort: 3000
